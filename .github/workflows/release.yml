# Builds Agent Console for Linux, macOS and Windows and attaches the files to a GitHub Release.
# Push a tag such as v0.3.0 to start it. "Run workflow" (manual start) builds the files
# but makes no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # One Linux runner cross-compiles the CLI for all targets. No macOS or Windows runner is needed.
  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build the CLI for each target
        run: |
          set -euo pipefail
          mkdir -p out
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            mkdir -p "build/$t"
            bun build src/cli.ts --compile --minify --sourcemap=linked \
              --target="bun-$t" --outfile="build/$t/agent-console$ext"
            if [ "$t" = windows-x64 ]; then
              (cd "build/$t" && zip -q "../../out/agent-console-$t.zip" "agent-console$ext")
            else
              tar -czf "out/agent-console-$t.tar.gz" -C "build/$t" agent-console
            fi
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/*

  # The desktop app (Electrobun) needs a native runner for each OS.
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Install Hutch (from the electrobun npm package)
        run: |
          npx -y electrobun@2.0.7 --version || true
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Build the desktop app
        working-directory: desktop
        run: |
          hutch --version
          hutch install --frozen-lockfile
          hutch run build
          ls -l artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: desktop/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.cli.result == 'success'
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Make SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            The files are not signed. On macOS, right-click the app and click Open the first time.
            On Windows, SmartScreen can show a warning: click More info, then Run anyway.
            The CLI needs tmux. On Windows, run the Linux CLI in WSL.
