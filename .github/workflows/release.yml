# Builds Agent Console for Linux, macOS and Windows and attaches the files to a GitHub Release.
#
# - Push a tag such as v0.4.0: the workflow builds that tag and makes its release.
# - Run workflow (manual start) with a tag: the workflow builds the default branch and
#   updates the release of that existing tag. The tag does not move.
#
# The release text is release-notes/<tag>.md. The workflow stops when that file is missing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to update, for example v0.3.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  ELECTROBUN: electrobun@2.0.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the release notes
        run: |
          test -s "release-notes/$TAG.md" || { echo "::error::release-notes/$TAG.md is missing"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # One Linux runner cross-compiles the CLI for all targets.
  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the CLI for each target
        run: |
          set -euo pipefail
          mkdir -p out
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            mkdir -p "build/$t"
            bun build src/cli.ts --compile --minify --sourcemap=linked \
              --target="bun-$t" --outfile="build/$t/agent-console$ext"
            if [ "$t" = windows-x64 ]; then
              (cd "build/$t" && zip -q "../../out/agent-console-$t.zip" "agent-console$ext")
            else
              tar -czf "out/agent-console-$t.tar.gz" -C "build/$t" agent-console
            fi
          done
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: out/*
          if-no-files-found: error
      # The Linux packages need the Linux CLI binary.
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64-bin
          path: build/linux-x64/agent-console
          if-no-files-found: error

  # The desktop app (Electrobun) needs a native runner for each OS.
  desktop:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Set the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Make the macOS icon
        if: runner.os == 'macOS'
        working-directory: desktop
        run: sh scripts/mac-iconset.sh
      - name: Build the desktop app
        working-directory: desktop
        run: |
          npx -y "$ELECTROBUN" build --env=stable
          ls -lR artifacts

      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          name: cli-linux-x64-bin
          path: ${{ runner.temp }}/cli
      - name: Package for Linux (.deb, AppImage)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          gh release download continuous --repo AppImage/appimagetool --pattern 'appimagetool-x86_64.AppImage' --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage" "$RUNNER_TEMP/cli/agent-console"
          # No FUSE on the runner: the AppImage tool unpacks itself and runs.
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            scripts/package-linux.sh "$VERSION" "$RUNNER_TEMP/cli/agent-console" \
            desktop/artifacts/stable-linux-x64-AgentConsole.tar.zst out
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p out
          dmg=$(ls desktop/artifacts/*.dmg 2>/dev/null | head -1 || true)
          if [ -n "$dmg" ]; then
            cp "$dmg" "out/AgentConsole-$VERSION-macos-arm64.dmg"
          else
            app=$(find desktop/build -maxdepth 3 -name '*.app' -type d | head -1)
            [ -n "$app" ] || { echo "::error::no .dmg and no .app found"; exit 1; }
            ditto -c -k --keepParent "$app" "out/AgentConsole-$VERSION-macos-arm64.zip"
          fi

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          for f in desktop/artifacts/*Setup*; do
            [ -e "$f" ] || continue
            ext="${f##*Setup}"
            cp "$f" "out/AgentConsole-$VERSION-windows-x64-Setup$ext"; n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no Setup file in desktop/artifacts"; exit 1; }

      - run: ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [test, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Make SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Agent Console ${{ env.TAG }}
          body_path: release-notes/${{ env.TAG }}.md
          files: dist/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
